[project]
id = "machete"
version = "0.6.0"
mach = "^7"
src  = "src"
work = "out/{target.name}/{profile.name}"

[target.windows-x86_64]
arch = "x86_64"
sys  = "windows"
abi  = "win64"

[target.linux-x86_64]
arch = "x86_64"
sys  = "linux"
abi  = "sysv64"

[target.linux-aarch64]
arch = "aarch64"
sys  = "linux"
abi  = "aapcs64"

[target.darwin-x86_64]
arch = "x86_64"
sys  = "darwin"
abi  = "sysv64"

[target.darwin-aarch64]
arch = "aarch64"
sys  = "darwin"
abi  = "darwinpcs"

[artifact.machete]
default = true
kind = "bin"
entry = "root.mach"
out = "{project.work}/bin/machete{artifact.suffix}"
targets = ["*"]
link = ["kernel32"]
need = []

# plays engine-vs-engine matches and sequential tests in Mach (src/tools/arena.mach), held to harness/match.py
[artifact.arena]
kind = "bin"
entry = "tools/arena.mach"
out = "{project.work}/bin/arena{artifact.suffix}"
targets = ["*"]
link = ["kernel32"]
need = []

# generates labelled positions in Mach (src/tools/gen.mach), held to harness/nnue/gen.py
[artifact.gen]
kind = "bin"
entry = "tools/gen.mach"
out = "{project.work}/bin/gen{artifact.suffix}"
targets = ["*"]
link = ["kernel32"]
need = []

# labels training records with a teacher engine in Mach (src/tools/label.mach), held to farm_label15k.py and farm_relabel.py
[artifact.label]
kind = "bin"
entry = "tools/label.mach"
out = "{project.work}/bin/label{artifact.suffix}"
targets = ["*"]
link = ["kernel32"]
need = []

# inspects and compares training-record files (src/tools/records.mach): stats, show, diff
[artifact.records]
kind = "bin"
entry = "tools/records.mach"
out = "{project.work}/bin/records{artifact.suffix}"
targets = ["*"]
link = ["kernel32"]
need = []

# holds the Syzygy prober to python-chess's answers (src/tools/tbcheck.mach; harness/syzygy_reference.py writes them)
[artifact.tbcheck]
kind = "bin"
entry = "tools/tbcheck.mach"
out = "{project.work}/bin/tbcheck{artifact.suffix}"
targets = ["*"]
link = ["kernel32"]
need = []

# trains the network in Mach (src/train.mach), checked against harness/nnue/train.py
[artifact.trainer]
kind = "bin"
entry = "tools/train.mach"
out = "{project.work}/bin/train{artifact.suffix}"
targets = ["*"]
link = ["kernel32"]
need = []

# decodes Leela training data (binpack) into training records; see src/binpack.mach
[artifact.binpack]
kind = "bin"
entry = "tools/binpack.mach"
out = "{project.work}/bin/binpack{artifact.suffix}"
targets = ["*"]
link = ["kernel32"]
need = []

[link.kernel32]
source = "system"
name = "kernel32.dll"
sys = ["windows"]
arch = ["*"]
abi  = ["*"]
export = false

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[dep.std]
git = "https://github.com/briar-systems/mach-std"
version = "^10.1"

[dep.json]
git = "https://github.com/briar-systems/mach-json"
version = "^0.1"
